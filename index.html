<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Rent Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .pulse-hover:hover {
            animation: pulse 1s infinite;
        }
        
        .gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        
        .rounded-xl {
            border-radius: 1rem;
        }
        
        .rounded-2xl {
            border-radius: 1.5rem;
        }
        
        .rounded-3xl {
            border-radius: 2rem;
        }
        
        .input-field {
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        
        .copy-success {
            color: #10B981;
            transform: scale(1.2);
        }
        
        .disabled-month {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md mx-auto">
        <div class="bg-white bg-opacity-90 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden fade-in">
            <!-- Header with month navigation -->
            <div class="bg-indigo-600 text-white p-6 relative">
                <div class="flex justify-between items-center mb-4">
                    <button id="prev-month" class="p-2 rounded-full bg-indigo-700 hover:bg-indigo-800 transition-colors duration-300">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h2 id="current-month" class="text-xl font-bold">Month Year</h2>
                    <button id="next-month" class="p-2 rounded-full bg-indigo-700 hover:bg-indigo-800 transition-colors duration-300 disabled:opacity-50" disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="text-center text-indigo-100 text-sm" id="current-date"></div>
            </div>
            
            <!-- Form container -->
            <div class="p-6">
                <form id="rent-form">
                    <div class="space-y-4">
                        <!-- Monthly Home Rent -->
                        <div>
                            <label for="monthly-rent" class="block text-sm font-medium text-gray-700 mb-1">Monthly Home Rent (₹)</label>
                            <input type="number" id="monthly-rent" class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500" min="0" step="0.01">
                        </div>
                        
                        <!-- Electricity Unit Rate -->
                        <div>
                            <label for="electricity-rate" class="block text-sm font-medium text-gray-700 mb-1">Electricity Unit Rate (₹/unit)</label>
                            <input type="number" id="electricity-rate" class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500" min="0" step="0.01">
                        </div>
                        
                        <!-- Last Month Electricity Units -->
                        <div>
                            <label for="last-month-units" class="block text-sm font-medium text-gray-700 mb-1">Last Month Electricity Units</label>
                            <input type="number" id="last-month-units" class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500" min="0" step="0.01" readonly>
                        </div>
                        
                        <!-- Current Month Electricity Units -->
                        <div>
                            <label for="current-month-units" class="block text-sm font-medium text-gray-700 mb-1">Current Month Electricity Units</label>
                            <input type="number" id="current-month-units" class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500" min="0" step="0.01">
                        </div>
                    </div>
                    
                    <!-- Buttons -->
                    <div class="mt-6 flex space-x-3">
                        <button type="button" id="calculate-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-medium transition-colors duration-300 pulse-hover">
                            Calculate
                        </button>
                        <button type="button" id="process-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded-xl font-medium transition-colors duration-300 pulse-hover">
                            Process
                        </button>
                    </div>
                </form>
                
                <!-- Rent Details -->
                <div id="rent-details" class="mt-6 bg-gray-50 p-4 rounded-xl border border-gray-200 relative hidden">
                    <button id="copy-btn" class="absolute top-3 right-3 text-gray-500 hover:text-indigo-600 transition-colors duration-300">
                        <i class="far fa-copy"></i>
                    </button>
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Rent Details</h3>
                    <div id="details-content" class="space-y-2 text-sm text-gray-700">
                        <!-- Details will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Initialize data if not exists
            if (!localStorage.getItem('rentData')) {
                const defaultData = {
                    config: {
                        monthlyRent: 10000,
                        electricityRate: 8.5
                    },
                    records: {}
                };
                localStorage.setItem('rentData', JSON.stringify(defaultData));
            }
            
            // Get current date
            const today = new Date();
            let currentDisplayDate = new Date(today.getFullYear(), today.getMonth(), 1);
            
            // Load data for current month
            loadMonthData(currentDisplayDate);
            
            // Update current date display
            updateCurrentDateDisplay();
            
            // Month navigation
            $('#prev-month').click(function() {
                currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
                loadMonthData(currentDisplayDate);
                updateNavButtons();
            });
            
            $('#next-month').click(function() {
                currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
                loadMonthData(currentDisplayDate);
                updateNavButtons();
            });
            
            // Calculate button
            $('#calculate-btn').click(function() {
                calculateRent();
            });
            
            // Process button
            $('#process-btn').click(function() {
                if (confirm('Are you sure you want to process and save this month\'s rent? This action cannot be undone.')) {
                    processRent();
                }
            });
            
            // Copy to clipboard
            $('#copy-btn').click(function() {
                const detailsText = $('#details-content').text();
                navigator.clipboard.writeText(detailsText).then(() => {
                    const $icon = $(this).find('i');
                    $icon.removeClass('fa-copy').addClass('fa-check copy-success');
                    setTimeout(() => {
                        $icon.removeClass('fa-check copy-success').addClass('fa-copy');
                    }, 2000);
                });
            });
            
            // Function to load month data
            function loadMonthData(date) {
                const rentData = JSON.parse(localStorage.getItem('rentData'));
                const monthKey = getMonthKey(date);
                const today = new Date();
                const isCurrentMonth = date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();
                const isBefore10th = today.getDate() < 10;
                
                // Update month display
                $('#current-month').text(formatMonthYear(date));
                
                // Load config values
                $('#monthly-rent').val(rentData.config.monthlyRent);
                $('#electricity-rate').val(rentData.config.electricityRate);
                
                // Check if we have data for this month
                if (rentData.records[monthKey]) {
                    // This month's data exists (viewing past month)
                    const record = rentData.records[monthKey];
                    $('#last-month-units').val(record.lastMonthUnits);
                    $('#current-month-units').val(record.currentMonthUnits);
                    
                    // Disable all fields and buttons (Scenario 1 or 4)
                    setFormDisabled(true);
                    
                    // Show calculated details
                    showRentDetails(record);
                } else if (isCurrentMonth) {
                    // Current month, no data yet
                    // Find previous month's current units to use as last month units
                    const prevMonth = new Date(date);
                    prevMonth.setMonth(prevMonth.getMonth() - 1);
                    const prevMonthKey = getMonthKey(prevMonth);
                    
                    if (rentData.records[prevMonthKey]) {
                        $('#last-month-units').val(rentData.records[prevMonthKey].currentMonthUnits);
                    } else {
                        $('#last-month-units').val(0);
                    }
                    
                    $('#current-month-units').val('');
                    
                    // Check if we're before the 10th (Scenario 1)
                    if (isBefore10th) {
                        setFormDisabled(true);
                        $('#rent-details').addClass('hidden');
                    } else {
                        // After 10th, allow editing (Scenario 2)
                        setFormDisabled(false);
                    }
                } else {
                    // Future month or month with no data
                    $('#last-month-units').val(0);
                    $('#current-month-units').val(0);
                    setFormDisabled(true);
                    $('#rent-details').addClass('hidden');
                }
            }
            
            // Function to calculate rent
            function calculateRent() {
                const monthlyRent = parseFloat($('#monthly-rent').val());
                const electricityRate = parseFloat($('#electricity-rate').val());
                const lastMonthUnits = parseFloat($('#last-month-units').val());
                const currentMonthUnits = parseFloat($('#current-month-units').val());
                
                // Validate inputs
                if (isNaN(monthlyRent) || isNaN(electricityRate) || isNaN(lastMonthUnits) || isNaN(currentMonthUnits)) {
                    alert('Please fill in all fields with valid numbers');
                    return;
                }
                
                if (currentMonthUnits < lastMonthUnits) {
                    alert('Current month units cannot be less than last month units');
                    return;
                }
                
                // Calculate
                const totalUnits = currentMonthUnits - lastMonthUnits;
                const electricityCost = totalUnits * electricityRate;
                const totalRent = monthlyRent + electricityCost;
                
                // Create record object
                const record = {
                    date: new Date().toISOString(),
                    monthlyRent: monthlyRent,
                    electricityRate: electricityRate,
                    lastMonthUnits: lastMonthUnits,
                    currentMonthUnits: currentMonthUnits,
                    totalUnits: totalUnits,
                    electricityCost: electricityCost,
                    totalRent: totalRent
                };
                
                // Show details
                showRentDetails(record);
            }
            
            // Function to process and save rent
            function processRent() {
                const monthlyRent = parseFloat($('#monthly-rent').val());
                const electricityRate = parseFloat($('#electricity-rate').val());
                const lastMonthUnits = parseFloat($('#last-month-units').val());
                const currentMonthUnits = parseFloat($('#current-month-units').val());
                
                // Validate inputs
                if (isNaN(monthlyRent) || isNaN(electricityRate) || isNaN(lastMonthUnits) || isNaN(currentMonthUnits)) {
                    alert('Please fill in all fields with valid numbers');
                    return;
                }
                
                if (currentMonthUnits < lastMonthUnits) {
                    alert('Current month units cannot be less than last month units');
                    return;
                }
                
                // Calculate
                const totalUnits = currentMonthUnits - lastMonthUnits;
                const electricityCost = totalUnits * electricityRate;
                const totalRent = monthlyRent + electricityCost;
                
                // Create record object
                const record = {
                    date: new Date().toISOString(),
                    monthlyRent: monthlyRent,
                    electricityRate: electricityRate,
                    lastMonthUnits: lastMonthUnits,
                    currentMonthUnits: currentMonthUnits,
                    totalUnits: totalUnits,
                    electricityCost: electricityCost,
                    totalRent: totalRent
                };
                
                // Save to localStorage
                const rentData = JSON.parse(localStorage.getItem('rentData'));
                const monthKey = getMonthKey(currentDisplayDate);
                
                // Check if already processed
                if (rentData.records[monthKey]) {
                    alert('This month\'s rent has already been processed.');
                    return;
                }
                
                rentData.records[monthKey] = record;
                localStorage.setItem('rentData', JSON.stringify(rentData));
                
                // Show details
                showRentDetails(record);
                
                // Disable form (Scenario 3)
                setFormDisabled(true);
                
                // Show success message
                alert('Rent processed and saved successfully!');
            }
            
            // Function to show rent details
            function showRentDetails(record) {
                const date = new Date(record.date);
                const monthYear = formatMonthYear(date);
                const dayMonth = formatDayMonth(date);
                
                let detailsHTML = `
                    <div><span class="font-semibold">${monthYear}</span></div>
                    <div>${dayMonth} - <span class="font-medium">${record.currentMonthUnits.toFixed(2)}</span> units</div>
                    <div class="pt-2">Total Units: <span class="font-medium">${record.currentMonthUnits.toFixed(2)} - ${record.lastMonthUnits.toFixed(2)} = ${record.totalUnits.toFixed(2)}</span></div>
                    <div>Electricity: <span class="font-medium">${record.totalUnits.toFixed(2)} × ₹${record.electricityRate.toFixed(2)} = ₹${record.electricityCost.toFixed(2)}</span></div>
                    <div class="pt-2"><span class="font-bold">Total Amount:</span></div>
                    <div><span class="font-bold">₹${record.monthlyRent.toFixed(2)} + ₹${record.electricityCost.toFixed(2)} = ₹${record.totalRent.toFixed(2)}</span></div>
                `;
                
                $('#details-content').html(detailsHTML);
                $('#rent-details').removeClass('hidden');
            }
            
            // Helper function to format month/year
            function formatMonthYear(date) {
                return date.toLocaleString('default', { month: 'short', year: 'numeric' });
            }
            
            // Helper function to format day/month
            function formatDayMonth(date) {
                return date.toLocaleString('default', { day: '2-digit', month: 'short' });
            }
            
            // Helper function to get month key (YYYY-MM)
            function getMonthKey(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            }
            
            // Helper function to set form disabled state
            function setFormDisabled(disabled) {
                $('#monthly-rent').prop('readonly', disabled);
                $('#electricity-rate').prop('readonly', disabled);
                $('#current-month-units').prop('readonly', disabled);
                
                if (disabled) {
                    $('#calculate-btn').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
                    $('#process-btn').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
                } else {
                    $('#calculate-btn').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
                    $('#process-btn').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
                }
            }
            
            // Helper function to update navigation buttons
            function updateNavButtons() {
                const today = new Date();
                const nextMonth = new Date(currentDisplayDate);
                nextMonth.setMonth(nextMonth.getMonth() + 1);
                
                // Disable next month button if it's the current month or future
                $('#next-month').prop('disabled', 
                    nextMonth.getMonth() > today.getMonth() || 
                    nextMonth.getFullYear() > today.getFullYear()
                );
            }
            
            // Helper function to update current date display
            function updateCurrentDateDisplay() {
                const today = new Date();
                $('#current-date').text(today.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                }));
            }
        });
    </script>
</body>
</html>
