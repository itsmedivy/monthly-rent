<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Rent Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        .bounce {
            animation: bounce 1s;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #f0fff4 0%, #ffebee 100%);
        }
        
        .form-container {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .copy-success {
            animation: bounce 0.5s;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="form-container bg-white rounded-3xl p-8 w-full max-w-md fade-in">
        <!-- Header with month navigation -->
        <div class="flex justify-between items-center mb-6">
            <button id="prev-month" class="rounded-full w-10 h-10 flex items-center justify-center bg-red-100 text-red-600 hover:bg-red-200 transition-all duration-300">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h2 id="current-month" class="text-xl font-bold text-gray-800"></h2>
            <button id="next-month" class="rounded-full w-10 h-10 flex items-center justify-center bg-green-100 text-green-600 hover:bg-green-200 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        
        <!-- Form inputs -->
        <div class="space-y-4">
            <div>
                <label for="monthly-rent" class="block text-sm font-medium text-gray-700 mb-1">Monthly Home Rent (₹)</label>
                <input type="number" id="monthly-rent" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-300">
            </div>
            
            <div>
                <label for="electricity-rate" class="block text-sm font-medium text-gray-700 mb-1">Electricity Unit Rate (₹/unit)</label>
                <input type="number" step="0.01" id="electricity-rate" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-300">
            </div>
            
            <div>
                <label for="last-month-units" class="block text-sm font-medium text-gray-700 mb-1">Last Month Electricity Units</label>
                <input type="number" step="0.01" id="last-month-units" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-300" readonly>
            </div>
            
            <div>
                <label for="current-month-units" class="block text-sm font-medium text-gray-700 mb-1">Current Month Electricity Units</label>
                <input type="number" step="0.01" id="current-month-units" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-300">
            </div>
            
            <div class="flex space-x-4 pt-2">
                <button id="calculate-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-xl transition-all duration-300 transform hover:scale-105">
                    Calculate
                </button>
                <button id="process-btn" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-xl transition-all duration-300 transform hover:scale-105">
                    Process
                </button>
            </div>
        </div>
        
        <!-- Results section -->
        <div id="results" class="mt-6 p-4 bg-gray-50 rounded-xl border border-gray-200 hidden relative">
            <button id="copy-btn" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white flex items-center justify-center text-gray-500 hover:text-green-600 transition-all duration-300">
                <i class="fas fa-copy" id="copy-icon"></i>
            </button>
            
            <h3 class="text-lg font-semibold text-gray-800 mb-2" id="result-month"></h3>
            <p class="text-sm text-gray-600 mb-4" id="result-date"></p>
            
            <div class="space-y-2 text-sm">
                <div class="flex justify-between">
                    <span>Current Month Units:</span>
                    <span id="current-units-display"></span>
                </div>
                <div class="flex justify-between">
                    <span>Total Units:</span>
                    <span id="total-units"></span>
                </div>
                <div class="flex justify-between">
                    <span>Electricity:</span>
                    <span id="electricity-cost"></span>
                </div>
                <div class="border-t border-gray-200 pt-2 mt-2 flex justify-between font-bold">
                    <span>Total Amount:</span>
                    <span id="total-amount"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Initialize data storage
            if (!localStorage.getItem('rentData')) {
                const initialData = {
                    config: {
                        monthlyRent: 10000,
                        electricityRate: 8.5
                    },
                    records: {}
                };
                localStorage.setItem('rentData', JSON.stringify(initialData));
            }
            
            // Get current date
            const today = new Date();
            let currentMonth = today.getMonth();
            let currentYear = today.getFullYear();
            let currentDay = today.getDate();
            
            // Load data for the current month
            loadMonthData(currentYear, currentMonth);
            updateMonthDisplay(currentYear, currentMonth);
            
            // Month navigation
            $('#prev-month').click(function() {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                loadMonthData(currentYear, currentMonth);
                updateMonthDisplay(currentYear, currentMonth);
            });
            
            $('#next-month').click(function() {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                loadMonthData(currentYear, currentMonth);
                updateMonthDisplay(currentYear, currentMonth);
            });
            
            // Calculate button
            $('#calculate-btn').click(function() {
                calculateRent();
            });
            
            // Process button
            $('#process-btn').click(function() {
                if (confirm("Are you sure you want to process and save this month's rent?")) {
                    saveRent();
                }
            });
            
            // Copy to clipboard
            $('#copy-btn').click(function() {
                const resultText = generateResultText();
                navigator.clipboard.writeText(resultText).then(function() {
                    $('#copy-icon').removeClass('fa-copy').addClass('fa-check text-green-600 copy-success');
                    setTimeout(function() {
                        $('#copy-icon').removeClass('fa-check text-green-600 copy-success').addClass('fa-copy');
                    }, 2000);
                });
            });
            
            // Helper functions
            function updateMonthDisplay(year, month) {
                const monthNames = ["January", "February", "March", "April", "May", "June", 
                                   "July", "August", "September", "October", "November", "December"];
                $('#current-month').text(`${monthNames[month]} ${year}`);
                
                // Disable next month button if trying to go to future months
                const currentDate = new Date();
                const currentMonth = currentDate.getMonth();
                const currentYear = currentDate.getFullYear();
                
                if (year > currentYear || (year === currentYear && month > currentMonth)) {
                    $('#next-month').prop('disabled', true);
                } else {
                    $('#next-month').prop('disabled', false);
                }
            }
            
            function loadMonthData(year, month) {
                const rentData = JSON.parse(localStorage.getItem('rentData'));
                const monthKey = `${year}-${month}`;
                const currentDate = new Date();
                const isCurrentMonth = (year === currentDate.getFullYear() && month === currentDate.getMonth());
                
                // Load config values
                $('#monthly-rent').val(rentData.config.monthlyRent);
                $('#electricity-rate').val(rentData.config.electricityRate);
                
                // Check if we have data for this month
                if (rentData.records[monthKey]) {
                    const record = rentData.records[monthKey];
                    $('#last-month-units').val(record.lastMonthUnits);
                    $('#current-month-units').val(record.currentMonthUnits);
                    
                    // Show results if available
                    if (record.processed) {
                        showResults(record, year, month);
                    } else {
                        $('#results').addClass('hidden');
                    }
                } else {
                    // For new months, try to get last month's current units as this month's last units
                    let lastMonth = month - 1;
                    let lastYear = year;
                    if (lastMonth < 0) {
                        lastMonth = 11;
                        lastYear--;
                    }
                    const lastMonthKey = `${lastYear}-${lastMonth}`;
                    
                    if (rentData.records[lastMonthKey]) {
                        $('#last-month-units').val(rentData.records[lastMonthKey].currentMonthUnits);
                    } else {
                        $('#last-month-units').val('0');
                    }
                    
                    $('#current-month-units').val('');
                    $('#results').addClass('hidden');
                }
                
                // Enable/disable inputs based on date and whether it's processed
                const isProcessed = rentData.records[monthKey] && rentData.records[monthKey].processed;
                const isEditable = isCurrentMonth && currentDay >= 10 && !isProcessed;
                
                $('#monthly-rent').prop('readonly', true);
                $('#electricity-rate').prop('readonly', true);
                $('#current-month-units').prop('readonly', !isEditable);
                
                // Show/hide buttons
                if (isCurrentMonth && currentDay >= 10 && !isProcessed) {
                    $('#calculate-btn, #process-btn').prop('disabled', false).removeClass('opacity-50');
                } else {
                    $('#calculate-btn, #process-btn').prop('disabled', true).addClass('opacity-50');
                }
                
                // Special case: before 10th of current month
                if (isCurrentMonth && currentDay < 10 && !isProcessed) {
                    $('#current-month-units').prop('readonly', true);
                }
            }
            
            function calculateRent() {
                const monthlyRent = parseFloat($('#monthly-rent').val());
                const electricityRate = parseFloat($('#electricity-rate').val());
                const lastMonthUnits = parseFloat($('#last-month-units').val());
                const currentMonthUnits = parseFloat($('#current-month-units').val());
                
                // Validation
                if (isNaN(monthlyRent) || isNaN(electricityRate) || isNaN(lastMonthUnits) || isNaN(currentMonthUnits)) {
                    alert('Please fill in all fields with valid numbers');
                    return;
                }
                
                if (currentMonthUnits < lastMonthUnits) {
                    alert('Current month units cannot be less than last month units');
                    return;
                }
                
                const totalUnits = currentMonthUnits - lastMonthUnits;
                const electricityCost = totalUnits * electricityRate;
                const totalAmount = monthlyRent + electricityCost;
                
                // Show results
                const currentDate = new Date();
                const month = currentDate.getMonth();
                const year = currentDate.getFullYear();
                
                const resultData = {
                    monthlyRent: monthlyRent,
                    electricityRate: electricityRate,
                    lastMonthUnits: lastMonthUnits,
                    currentMonthUnits: currentMonthUnits,
                    totalUnits: totalUnits,
                    electricityCost: electricityCost,
                    totalAmount: totalAmount,
                    processed: false
                };
                
                showResults(resultData, year, month);
            }
            
            function showResults(data, year, month) {
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", 
                                   "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const date = new Date();
                const day = date.getDate();
                
                $('#result-month').text(`${monthNames[month]}-${year}`);
                $('#result-date').text(`${day}-${monthNames[month]}`);
                $('#current-units-display').text(data.currentMonthUnits);
                $('#total-units').text(`${data.currentMonthUnits} - ${data.lastMonthUnits} = ${data.totalUnits.toFixed(2)}`);
                $('#electricity-cost').text(`${data.totalUnits.toFixed(2)} × ₹${data.electricityRate} = ₹${data.electricityCost.toFixed(2)}`);
                $('#total-amount').text(`₹${data.monthlyRent} + ₹${data.electricityCost.toFixed(2)} = ₹${data.totalAmount.toFixed(2)}`);
                
                $('#results').removeClass('hidden').addClass('pulse');
                setTimeout(() => {
                    $('#results').removeClass('pulse');
                }, 1500);
            }
            
            function saveRent() {
                const monthlyRent = parseFloat($('#monthly-rent').val());
                const electricityRate = parseFloat($('#electricity-rate').val());
                const lastMonthUnits = parseFloat($('#last-month-units').val());
                const currentMonthUnits = parseFloat($('#current-month-units').val());
                
                // Validation
                if (isNaN(monthlyRent) || isNaN(electricityRate) || isNaN(lastMonthUnits) || isNaN(currentMonthUnits)) {
                    alert('Please fill in all fields with valid numbers');
                    return;
                }
                
                if (currentMonthUnits < lastMonthUnits) {
                    alert('Current month units cannot be less than last month units');
                    return;
                }
                
                const totalUnits = currentMonthUnits - lastMonthUnits;
                const electricityCost = totalUnits * electricityRate;
                const totalAmount = monthlyRent + electricityCost;
                
                const currentDate = new Date();
                const month = currentDate.getMonth();
                const year = currentDate.getFullYear();
                const monthKey = `${year}-${month}`;
                
                const rentData = JSON.parse(localStorage.getItem('rentData'));
                
                // Check if already processed
                if (rentData.records[monthKey] && rentData.records[monthKey].processed) {
                    alert('This month has already been processed');
                    return;
                }
                
                // Save the record
                rentData.records[monthKey] = {
                    monthlyRent: monthlyRent,
                    electricityRate: electricityRate,
                    lastMonthUnits: lastMonthUnits,
                    currentMonthUnits: currentMonthUnits,
                    totalUnits: totalUnits,
                    electricityCost: electricityCost,
                    totalAmount: totalAmount,
                    processed: true,
                    processedDate: new Date().toISOString()
                };
                
                localStorage.setItem('rentData', JSON.stringify(rentData));
                
               
</body>
</html>
