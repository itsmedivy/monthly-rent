<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Rent Calculator</title>
    <link rel="icon" type="image/x-icon" href="dist/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="dist/css/style.css" />
</head>

<body class="min-h-screen gradient-bg flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md mx-auto">
        <div class="bg-white bg-opacity-90 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden fade-in">
            <!-- Header with month navigation -->
            <div class="bg-indigo-600 text-white p-6 relative">
                <div class="flex justify-between items-center mb-4">
                    <button id="prev-month"
                        class="p-2 rounded-full bg-indigo-700 hover:bg-indigo-800 transition-colors duration-300">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h2 id="current-month" class="text-xl font-bold">Month Year</h2>
                    <button id="next-month"
                        class="p-2 rounded-full bg-indigo-700 hover:bg-indigo-800 transition-colors duration-300 disabled:opacity-50"
                        disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="relative flex justify-between items-center">
                    <div class="absolute left-1/2 transform -translate-x-1/2 text-center text-indigo-100 text-sm"
                        id="current-date"></div>
                    <button id="settings"
                        class="ml-auto p-2 rounded-full hover:bg-indigo-800 transition-colors duration-300 opacity-0">
                        <i class="fas fa-gear"></i>
                    </button>
                </div>
            </div>

            <!-- Form container -->
            <div class="p-6">
                <form id="rent-form">
                    <div class="space-y-4">
                        <!-- Monthly Home Rent -->
                        <div>
                            <label for="monthly-rent" class="block text-sm font-medium text-gray-700 mb-1">Monthly Home
                                Rent (₹)</label>
                            <input type="number" id="monthly-rent"
                                class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                                min="0" step="0.01">
                        </div>

                        <!-- Electricity Unit Rate -->
                        <div>
                            <label for="electricity-rate"
                                class="block text-sm font-medium text-gray-700 mb-1">Electricity Unit Rate
                                (₹/unit)</label>
                            <input type="number" id="electricity-rate"
                                class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                                min="0" step="0.01">
                        </div>

                        <!-- Last Month Electricity Units -->
                        <div>
                            <label for="last-month-units" class="block text-sm font-medium text-gray-700 mb-1">Last
                                Month Electricity Units</label>
                            <input type="number" id="last-month-units"
                                class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                                min="0" step="0.01">
                        </div>

                        <!-- Current Month Electricity Units -->
                        <div>
                            <label for="current-month-units"
                                class="block text-sm font-medium text-gray-700 mb-1">Current Month Electricity
                                Units</label>
                            <input type="number" id="current-month-units"
                                class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                                min="0" step="0.01">
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="mt-6 flex space-x-3">
                        <button type="button" id="calculate-btn"
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-medium transition-colors duration-300 pulse-hover">
                            <i class="fas fa-pen"></i>&nbsp;
                            Calculate
                        </button>
                        <button type="button" id="process-btn"
                            class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded-xl font-medium transition-colors duration-300 pulse-hover">
                            <i class="fas fa-paper-plane"></i>&nbsp;
                            Process
                        </button>
                    </div>
                </form>

                <!-- Rent Details -->
                <div id="rent-details" class="mt-6 bg-gray-50 p-4 rounded-xl border border-gray-200 relative hidden">
                    <button id="copy-btn"
                        class="absolute top-3 right-3 text-gray-500 hover:text-indigo-600 transition-colors duration-300">
                        <i class="copy-icon far fa-copy"></i>
                    </button>
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Rent Details</h3>
                    <div id="details-content" class="space-y-2 text-sm text-gray-700">
                        <!-- Details will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Modal -->
    <!-- Popup Overlay -->
    <div id="popupOverlay"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 opacity-0 scale-95 pointer-events-none transition-all duration-300">
        <!-- Popup Box -->
        <div id="popupBox"
            class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 transform transition-all duration-300 scale-95 opacity-0">
            <h2 class="text-xl font-semibold mb-4"><i class="fas fa-gears"></i>&nbsp;Settings</h2>
             <!-- Tabs -->
      <div class="flex space-x-4 mb-4 border-b">
        <button id="importTab" class="py-2 px-4 border-b-2 border-blue-600 text-blue-600 font-semibold">Import</button>
        <button id="exportTab" class="py-2 px-4 text-gray-600 hover:text-blue-600">Export</button>
      </div>
            <form id="myForm">
                <div class="mb-4">
                    <label for="app-name" class="block text-sm font-medium text-gray-700 mb-1">App Name</label>
                    <input type="text" id="app-name"
                        class="w-full px-4 py-3 input-field rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelBtn"
                        class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- Popup Modal Ends -->
    <script src="dist/js/main.js"></script>
</body>

</html>
